<body>
<div class="editor">
  <header class="toolbar">
    <div><h1>把位置调到你喜欢的样子</h1><p>拖动蓝框移动，拉右下角改变大小。调好后保存，我再同步到线上。</p></div>

  </header>
  <main class="workspace">

      </div></div>
      <span class="scale-note"></span>
    </section>
    <aside class="controls" aria-label="调整尺寸和位置">

      <p class="target-hint"></p>
      <div class="field-list"></div>
      <button id="distribute" class="secondary wide">让三个选项等距排列</button>
      <div class="readout" aria-live="polite"><strong id="layout-status">正在载入当前版本…</strong><span id="layout-measure"></span></div>
      <div class="save-actions"><button id="reset" class="secondary">恢复当前线上</button><button id="save" class="primary">保存我的排版</button></div>
      <p id="save-status" role="status" aria-live="polite">保存后回到聊天，告诉我“按这版改”。</p>
      <button id="download" class="text-button" disabled>导出排版参数</button>
      <details id="saved-details"><summary>查看已保存的位置</summary><textarea id="saved-layout" readonly aria-label="已保存的排版参数"></textarea></details>
    </aside>
  </main>
</div>

    for(const f of specs()){const number=document.querySelector('[data-number='+f.key+']'),range=document.querySelector('[data-range='+f.key+']');if(number&&document.activeElement!==number)number.value=round(values[selected][f.key]);if(range)range.value=values[selected][f.key];}
    const warn=warnings();document.querySelector('.readout').dataset.warning=String(!!warn.length);document.querySelector('#layout-status').textContent=warn.length?warn.join('；'):'当前没有区域重叠。';document.querySelector('#layout-measure').textContent='选项高度 '+round(c.height)+' · 间距 '+round(c.gap)+' · 解析栏 '+round(values.analysis.height)+' px';
  }
  document.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.target)));
  viewportSelect.addEventListener('change',()=>{viewport=viewportSelect.value.split(',').map(Number);try{localStorage.setItem(schema+':viewport'+scope,viewportSelect.value);}catch{}loadFrame();});
  document.querySelector('#distribute').addEventListener('click',()=>{if(!values)return;const top=values.question.y+values.question.height,available=values.analysis.y-top,n=parts.rows.length;values.cards.height=Math.max(32,Math.min(values.cards.height,Math.floor((available-(n+1)*12)/n)));values.cards.gap=round(Math.max(4,(available-n*values.cards.height)/(n+1)));values.cards.y=round(top+values.cards.gap);rememberDraft();render();});
  document.querySelector('#reset').addEventListener('click',()=>{if(!baseline)return;values=copy(baseline);rememberDraft();render();status('已恢复这一尺寸的线上原始位置。');});
  document.querySelector('#save').addEventListener('click',()=>{if(!values)return;saved={schema,sourceVersion,sourceSha,viewport:{width:viewport[0],height:viewport[1]},values:copy(values),rectangles:rects(),warnings:warnings(),savedAt:new Date().toISOString()};try{localStorage.setItem(savedKey,JSON.stringify(saved));localStorage.setItem(draftKey(),JSON.stringify({sourceVersion,values}));document.querySelector('#save').textContent='排版已保存';document.querySelector('#save-top').textContent='已保存';status('已保存。回到聊天告诉我“按这版改”，我会读取这组位置。');showSaved();}catch{status('浏览器保存失败，请点击导出参数保留这组位置。');showSaved();}});
  document.querySelector('#save-top').addEventListener('click',()=>document.querySelector('#save').click());
  function showSaved(){if(!saved)return;document.querySelector('#saved-layout').value=JSON.stringify(saved,null,2);document.querySelector('#download').disabled=false;document.querySelector('#saved-details summary').textContent='已保存 '+saved.viewport.width+' × '+saved.viewport.height+' 的位置';}
  document.querySelector('#download').addEventListener('click',()=>{if(!saved)return;const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));link.href=url;link.download='CSCS-排版位置-'+saved.viewport.width+'x'+saved.viewport.height+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
  try{saved=JSON.parse(localStorage.getItem(savedKey)||'null');if(saved?.schema!==schema)saved=null;const last=localStorage.getItem(schema+':viewport'+scope);if(['430,555','390,720','320,640'].includes(last)){viewport=last.split(',').map(Number);viewportSelect.value=last;}showSaved();}catch{}
  new ResizeObserver(fitPreview).observe(area);loadFrame();
})();
